version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      go-deps:
        patterns: ["*"]
    commit-message:
      prefix: "deps"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      # One PR per Monday for all action bumps; with SHA pinning, ungrouped meant several identical reviews.
      actions-deps:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
