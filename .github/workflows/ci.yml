name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue tests each entry against current main; without this trigger queued PRs hang.
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  shared:
    uses: ./.github/workflows/shared-checks.yml
    permissions:
      contents: read
      pull-requests: read

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make fmt vet lint

  test:
    name: Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        go: [oldest, stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # "oldest" is the floor declared in go.mod, so a use of a newer API fails here.
          go-version-file: ${{ matrix.go == 'oldest' && 'go.mod' || '' }}
          go-version: ${{ matrix.go == 'stable' && 'stable' || '' }}
      - name: Race tests and coverage floor
        if: ${{ matrix.go == 'stable' }}
        run: make cover
      - name: Race tests
        if: ${{ matrix.go == 'oldest' }}
        run: make test

  ci:
    name: CI
    needs: [shared, lint, test]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Gate on all jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: scripts/ci/require-needs.sh
