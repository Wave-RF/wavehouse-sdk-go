# Checks both WaveHouse SDK repos run; keep this file identical in
# wavehouse-sdk-js and wavehouse-sdk-go. ci.yml calls it as a job,
#
#   shared:
#     uses: ./.github/workflows/shared-checks.yml
#     permissions: { contents: read, pull-requests: read }
#
# and lists that job in the needs of its `CI` aggregator, the required check.
name: Shared checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  pr-title:
    name: PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      # The default branch's validator, so a PR can't change the rule that judges it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Check the PR title
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: scripts/ci/check-pr-title.sh

  lint-automation:
    name: Lint workflows and scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        run: git ls-files -z '*.sh' | xargs -0 -r shellcheck -x
      # `go run` at a version, so the module checksum database vouches for the binary.
      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
